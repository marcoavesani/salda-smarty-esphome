<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Roboto, 'Segoe UI', Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#8a94a6" stroke-opacity="0.35" stroke-width="3"/>
    </pattern>
    <linearGradient id="g-in" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ccf91"/>
      <stop offset="1" stop-color="#4aa3ff"/>
    </linearGradient>
    <linearGradient id="g-out" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
  </defs>

  <!-- etichette fisse -->
  <text x="40" y="42" font-size="18" letter-spacing="3" fill="#8a94a6">FUORI</text>
  <text x="960" y="42" font-size="18" letter-spacing="3" fill="#8a94a6" text-anchor="end">IN CASA</text>
  <text x="40" y="92" font-size="24" font-weight="600" fill="#3ccf91">Esterno</text>
  <text x="960" y="92" font-size="24" font-weight="600" fill="#f5c542" text-anchor="end">Ripresa</text>
  <text x="40" y="505" font-size="24" font-weight="600" fill="#ff9a3c">Espulsione</text>
  <text x="960" y="505" font-size="24" font-weight="600" fill="#4aa3ff" text-anchor="end">Mandata</text>

  <!-- involucro dell'unità -->
  <rect x="430" y="8" width="140" height="62" fill="url(#hatch)"/>
  <rect x="430" y="450" width="140" height="62" fill="url(#hatch)"/>
  <rect x="370" y="70" width="260" height="380" rx="34" fill="#8a94a6" fill-opacity="0.08" stroke="#8a94a6" stroke-opacity="0.45" stroke-width="3"/>
  <text x="500" y="108" font-size="18" letter-spacing="3" fill="#8a94a6" text-anchor="middle">SMARTY</text>

  <!-- scambiatore a flussi incrociati -->
  <polygon points="500,170 600,270 500,370 400,270" fill="#8a94a6" fill-opacity="0.12" stroke="#8a94a6" stroke-opacity="0.6" stroke-width="3"/>
  <g stroke="#8a94a6" stroke-opacity="0.35" stroke-width="2">
    <line x1="460" y1="210" x2="540" y2="210"/>
    <line x1="430" y1="240" x2="570" y2="240"/>
    <line x1="400" y1="270" x2="600" y2="270"/>
    <line x1="430" y1="300" x2="570" y2="300"/>
    <line x1="460" y1="330" x2="540" y2="330"/>
  </g>

  <!-- aria esterna -> mandata -->
  <polyline points="40,170 385,170 455,240 545,330 615,370 900,370" fill="none" stroke="url(#g-in)" stroke-width="16" stroke-linejoin="round" stroke-opacity="0.9"/>
  <polyline points="40,170 385,170" fill="none" stroke="#3ccf91" stroke-width="16"/>
  <polyline points="615,370 900,370" fill="none" stroke="#4aa3ff" stroke-width="16"/>
  <polygon points="900,346 960,370 900,394" fill="#4aa3ff"/>
  <polygon points="300,150 340,170 300,190" fill="#3ccf91"/>

  <!-- ripresa -> espulsione -->
  <polyline points="960,170 615,170 545,240 455,330 385,370 100,370" fill="none" stroke="url(#g-out)" stroke-width="16" stroke-linejoin="round" stroke-opacity="0.9"/>
  <polyline points="960,170 615,170" fill="none" stroke="#f5c542" stroke-width="16"/>
  <polyline points="385,370 100,370" fill="none" stroke="#ff9a3c" stroke-width="16"/>
  <polygon points="100,346 40,370 100,394" fill="#ff9a3c"/>
  <polygon points="700,150 660,170 700,190" fill="#f5c542"/>

  <!-- filtri -->
  <rect x="352" y="146" width="18" height="48" rx="5" fill="#ff5a5a" fill-opacity="0.25" stroke="#ff5a5a" stroke-width="3"/>
  <rect x="630" y="146" width="18" height="48" rx="5" fill="#8a94a6" fill-opacity="0.25" stroke="#8a94a6" stroke-width="3"/>

  <!-- ventilatori -->
  <g transform="translate(330 370)">
    <circle r="30" fill="#ff9a3c" fill-opacity="0.15" stroke="#ff9a3c" stroke-width="4"/>
    <g fill="#ff9a3c"><ellipse cx="0" cy="-12" rx="7" ry="13" transform="rotate(0)"/><ellipse cx="0" cy="-12" rx="7" ry="13" transform="rotate(120)"/><ellipse cx="0" cy="-12" rx="7" ry="13" transform="rotate(240)"/></g>
    <circle r="4" fill="#ff9a3c"/>
  </g>
  <g transform="translate(670 370)">
    <circle r="30" fill="#4aa3ff" fill-opacity="0.15" stroke="#4aa3ff" stroke-width="4"/>
    <g fill="#4aa3ff"><ellipse cx="0" cy="-12" rx="7" ry="13" transform="rotate(0)"/><ellipse cx="0" cy="-12" rx="7" ry="13" transform="rotate(120)"/><ellipse cx="0" cy="-12" rx="7" ry="13" transform="rotate(240)"/></g>
    <circle r="4" fill="#4aa3ff"/>
  </g>
</svg>
