# Vista "VMC" per una dashboard a sezioni. Generata da genera_vista_vmc.py: non modificare a mano.
title: VMC
path: vmc
icon: mdi:hvac
type: sections
max_columns: 3
sections:
- type: grid
  cards:
  - type: heading
    heading: Stato
    icon: mdi:hvac
    badges:
    - type: entity
      entity: binary_sensor.quadro_elettrico_vmc_salda_smarty_pannello_s_touch_attivo
      show_state: true
      show_icon: true
      color: green
  - type: tile
    entity: sensor.quadro_elettrico_vmc_salda_smarty_stato_sistema
    name: Stato
    icon: mdi:state-machine
    grid_options:
      columns: full
    vertical: false
  - type: tile
    entity: select.quadro_elettrico_vmc_salda_smarty_modalita
    name: Modalità
    icon: mdi:fan
    grid_options:
      columns: full
    features: &id002
    - type: select-options
  - type: tile
    entity: switch.quadro_elettrico_vmc_salda_smarty_boost
    name: Boost
    icon: mdi:fan-plus
    grid_options:
      columns: full
    features: &id003
    - type: toggle
    features_position: inline
  - type: tile
    entity: sensor.quadro_elettrico_vmc_salda_smarty_boost_tempo_residuo
    name: Boost residuo
    icon: mdi:timer-sand
  - type: tile
    entity: sensor.quadro_elettrico_vmc_salda_smarty_ventilatore_mandata_portata
    name: Ventilatori
    icon: mdi:fan
  - type: tile
    entity: number.quadro_elettrico_vmc_salda_smarty_portata_aria
    name: Portata
    icon: mdi:fan-chevron-up
    grid_options:
      columns: full
    features: &id001
    - type: numeric-input
      style: buttons
    features_position: inline
  - type: tile
    entity: number.quadro_elettrico_vmc_salda_smarty_setpoint_comfort
    name: Setpoint Comfort
    icon: mdi:thermometer
    grid_options:
      columns: full
    features: *id001
    features_position: inline
  - type: tile
    entity: number.quadro_elettrico_vmc_salda_smarty_setpoint_economy
    name: Setpoint Economy
    icon: mdi:thermometer-low
    grid_options:
      columns: full
    features: *id001
    features_position: inline
  - type: tile
    entity: sensor.quadro_elettrico_vmc_salda_smarty_temperatura_mandata_richiesta
    name: Mandata richiesta
    icon: mdi:thermometer-check
    grid_options:
      columns: full
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Flussi d'aria
    icon: mdi:swap-horizontal-bold
  - type: picture-elements
