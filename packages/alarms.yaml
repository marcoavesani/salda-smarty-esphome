# =============================================================================
#  Allarmi (discrete input, FC02). Il numero del discrete input coincide con
#  il codice mostrato dall'S-Touch (A.xx = allarme, W.xx = avviso).
#  Solo i codici pertinenti a una Smarty (niente batterie ad acqua, DX, serrande
#  tagliafuoco...). I singoli allarmi sono disabilitati di default in HA ma
#  alimentano il sensore di testo "Allarmi attivi".
#  I singoli codici sono letti un ciclo su tre (skip_updates: 2).
# =============================================================================

binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: smarty
    name: Allarme critico
    device_class: problem
    register_type: discrete_input
    address: 188

  - platform: modbus_controller
    modbus_controller_id: smarty
    name: Avviso attivo
    device_class: problem
    register_type: discrete_input
    address: 189

  # ---- Singoli codici ---------------------------------------------------------
  - {platform: modbus_controller, modbus_controller_id: smarty, register_type: discrete_input, entity_category: diagnostic, disabled_by_default: true, device_class: problem, skip_updates: 2,
     id: al_3, address: 3, name: "W03 Protezione secchezza"}
