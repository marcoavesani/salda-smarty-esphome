text_sensor:
  - platform: template
    name: Allarmi attivi
    icon: mdi:alert
    update_interval: 15s
    lambda: |-
      binary_sensor::BinarySensor *const list[] = {
          id(al_3), id(al_4), id(al_5), id(al_8), id(al_9), id(al_10), id(al_11),
          id(al_14), id(al_15), id(al_16), id(al_17), id(al_18), id(al_19),
          id(al_24), id(al_25), id(al_26), id(al_27), id(al_34), id(al_35),
          id(al_38), id(al_39), id(al_44), id(al_47), id(al_49), id(al_50),
          id(al_55), id(al_56), id(al_58)};
      std::string out;
      for (auto *b : list) {
        if (b->has_state() && b->state) {
          if (!out.empty()) out += "; ";
          out += std::string(b->get_name());
        }
      }
      if (out.empty()) out = "Nessuno";
      if (out.size() > 250) out = out.substr(0, 247) + "...";
      return out;
