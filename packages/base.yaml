# Parti comuni a salda-smarty.yaml (diretto) e salda-smarty-proxy.yaml (proxy).

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: Salda Smarty via Modbus RTU (RS485)
  project:
    name: local.salda_smarty
    version: "0.3.0"

esp32:
  board: ${board}
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name}-fallback
    password: !secret fallback_password

captive_portal:

web_server:
  port: 80

time:
  - platform: homeassistant
    id: ha_time
